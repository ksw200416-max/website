[package]
name = "myproject"
version = "0.1.0"
edition = "2021"
default-run = "myproject"

[dependencies]
axum = "=0.6.20"
tokio = { version = "=1.32.0", features = ["full"] }
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.107"
sqlx = { version = "=0.6.3", features = ["runtime-tokio-native-tls", "sqlite"] }
tower-http = { version = "=0.4.4", features = ["cors"] }